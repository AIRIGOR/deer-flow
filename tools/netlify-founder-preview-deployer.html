<!doctype html><html><head><meta charset="utf-8"><title>RIGOR Founder Preview Deployer</title><style>body{background:#080b0e;color:#f3f6f7;font:16px system-ui;padding:40px;max-width:760px;margin:auto}.ok{color:#4de19d}.bad{color:#ff6c6c}pre{white-space:pre-wrap;background:#10161b;padding:16px;border-radius:12px}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><h1>RIGOR Founder Preview</h1><p id="status">Preparing complete RIGOR preview package…</p><pre id="detail"></pre><script>
(async()=>{const status=document.getElementById('status'),detail=document.getElementById('detail');try{
const proxy=decodeURIComponent(location.hash.slice(1));if(!proxy.startsWith('https://netlify-mcp.netlify.app/proxy/'))throw new Error('Missing deployment capability');
const files=[".action-layer-proof-v1",".git-linked-preview",".gitkeep","README.md","app/__init__.py","app/database.py","app/main.py","app/seed.py","app/service.py","app/static/app.js","app/static/founder.css","app/static/founder.html","app/static/founder.js","app/static/index.html","app/static/styles.css","netlify.toml","netlify/functions/_shared/model.test.ts","netlify/functions/_shared/model.ts","netlify/functions/_shared/seed.ts","netlify/functions/rigor-api.mts","netlify/functions/rigor-company-action-runner-background.mts","netlify/functions/rigor-company-health.mts","netlify/functions/rigor-company-pulse-background.mts","netlify/functions/rigor-company-schedule.mts","package-lock.json","package.json","requirements.txt","scripts/bootstrap-preview-cicd.sh","scripts/virtual-production-runner.ts","scripts/write-deploy-meta.mjs","tsconfig.json"];
const base='https://raw.githubusercontent.com/AIRIGOR/deer-flow/f8b223b12bd0d309164611aad8e810a807e2121d/rigor_beta/';
const zip=new JSZip();let done=0;
for(const path of files){status.textContent='Packaging RIGOR source… '+(++done)+'/'+files.length+' · '+path;const res=await fetch(base+path);if(!res.ok)throw new Error('Source fetch failed '+res.status+' '+path);zip.file(path,await res.arrayBuffer());}
status.textContent='Compressing full RIGOR package…';const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
const form=new FormData();form.append('zip',blob,'rigor-founder-preview.zip');status.textContent='Uploading Founder Command Center to isolated Netlify branch…';
const url=proxy+'/api/v1/sites/017e4a4d-7db9-4e61-88fd-56dd2b2be844/builds?branch=founder-command-center-v1&title=RIGOR%20Founder%20Command%20Center%20v1';
const res=await fetch(url,{method:'POST',body:form});const text=await res.text();if(!res.ok)throw new Error('Netlify '+res.status+': '+text);const data=JSON.parse(text);
status.className='ok';status.textContent='Upload accepted. Netlify is building the complete isolated preview.';detail.textContent=JSON.stringify(data,null,2);document.title='RIGOR DEPLOY ACCEPTED';
}catch(e){status.className='bad';status.textContent='Deployment failed';detail.textContent=String(e);document.title='RIGOR DEPLOY FAILED';}})();
</script></body></html>

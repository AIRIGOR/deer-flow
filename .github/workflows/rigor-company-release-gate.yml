name: RIGOR Company Release Gate
on:
  workflow_dispatch:
    inputs:
      rigor_url:
        description: Deployed RIGOR URL with the authenticated command API
        default: https://rigor-flow-preview.netlify.app
        required: true
permissions:
  contents: read
jobs:
  company-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RIGOR_URL: ${{ inputs.rigor_url }}
      RIGOR_AUTOMATION_TOKEN: ${{ secrets.RIGOR_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require protected execution credential
        run: test -n "$RIGOR_AUTOMATION_TOKEN"
      - name: Verify public founder authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/founder-auth.json --write-out '%{http_code}' --max-time 30 "$RIGOR_URL/api/founder")"
          test "$code" = 401
      - name: Require strict AI ingestion and product gates
        working-directory: rigor_beta
        run: python scripts/live-pod-proof.py --url "$RIGOR_URL"
      - name: Require two fresh cycles and one persisted founder command
        working-directory: rigor_beta
        run: python scripts/live-company-proof.py --url "$RIGOR_URL"
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rigor-live-release-evidence
          path: rigor_beta/.artifacts/
          if-no-files-found: ignore

name: RIGOR Action Layer Proof

on:
  push:
    branches:
      - feat/rigor-netlify-beta-v1
    paths:
      - "rigor_beta/.action-layer-proof-v1"

permissions:
  contents: read

jobs:
  prove-action-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIGOR_URL: https://rigor-flow-preview.netlify.app

    steps:
      - name: Wait for Action Layer v1 deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 30 "$RIGOR_URL/api/company/health" > /tmp/before.json; then
              if python - <<'PY'
          import json
          data=json.load(open("/tmp/before.json", encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("action_layer") == "v1", data
          assert isinstance(data.get("action_queue"), dict), data
          print("Action Layer v1 deployed")
          PY
              then
                cat /tmp/before.json
                exit 0
              fi
            fi
            echo "Attempt $attempt/30: waiting for action layer deployment..."
            sleep 10
          done
          echo "Action Layer v1 did not become healthy in time."
          exit 1

      - name: Capture pre-cycle pulse
        id: before
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(python - <<'PY'
          import json
          data=json.load(open("/tmp/before.json", encoding="utf-8"))
          print(data.get("latest_pulse_at") or "")
          PY
          )"
          echo "pulse=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Pre-cycle pulse: $BEFORE"

      - name: Trigger one live company cycle
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/trigger.txt             --write-out "%{http_code}"             --max-time 30             --request POST             "$RIGOR_URL/.netlify/functions/rigor-company-schedule")"
          cat /tmp/trigger.txt || true
          case "$code" in
            200|202|204) ;;
            *)
              echo "Company cycle trigger failed: HTTP $code"
              exit 1
              ;;
          esac
          echo "Company cycle accepted: HTTP $code"

      - name: Prove durable action queue
        shell: bash
        env:
          BEFORE_PULSE: ${{ steps.before.outputs.pulse }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 30 "$RIGOR_URL/api/company/health" > /tmp/after.json; then
              if python - "$BEFORE_PULSE" <<'PY'
          import json
          import sys

          before=sys.argv[1]
          data=json.load(open("/tmp/after.json", encoding="utf-8"))
          current=data.get("latest_pulse_at") or ""
          queue=data.get("action_queue") or {}

          assert data.get("status") == "ok", data
          assert data.get("action_layer") == "v1", data
          assert current and current != before, (before, current, data)
          assert isinstance(queue, dict), data
          assert int(queue.get("total") or 0) >= 1, queue
          assert "approved" in queue, queue
          assert "needs_founder_approval" in queue, queue

          print("RIGOR Action Layer v1: PASS")
          print("New pulse:", current)
          print("Action queue:", queue)
          PY
              then
                cat /tmp/after.json
                exit 0
              fi
            fi
            echo "Attempt $attempt/60: waiting for completed cycle + populated action queue..."
            sleep 15
          done
          echo "Live action queue proof did not complete within 15 minutes."
          cat /tmp/after.json || true
          exit 1

      - name: Publish proof
        shell: bash
        run: |
          {
            echo "## RIGOR Action Layer v1 — LIVE PROOF PASS"
            echo ""
            echo "- Preview: https://rigor-flow-preview.netlify.app"
            echo "- Action layer: v1"
            echo "- A new AI-company pulse completed"
            echo "- Durable action queue contains at least one action"
            echo "- Automatic-lane and Founder-approval counts are exposed"
            echo "- No external/binding action was executed by this proof"
            echo ""
            echo '~~~json'
            cat /tmp/after.json
            echo ""
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

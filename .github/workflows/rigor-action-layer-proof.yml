name: RIGOR Action Layer Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-action-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RIGOR_URL: https://rigor-flow-preview.netlify.app

    steps:
      - name: Verify live Action Layer health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$RIGOR_URL/api/company/health" > /tmp/health.json
          cat /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/health.json", encoding="utf-8"))
          queue=data.get("action_queue") or {}
          assert data.get("status") == "ok", data
          assert data.get("action_layer") == "v1", data
          assert isinstance(queue, dict), data
          assert "total" in queue, queue
          assert "approved" in queue, queue
          assert "needs_founder_approval" in queue, queue
          print("RIGOR Action Layer v1 health: PASS")
          PY

      - name: Verify queue has been exercised
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data=json.load(open("/tmp/health.json", encoding="utf-8"))
          queue=data.get("action_queue") or {}
          total=int(queue.get("total") or 0)
          if total < 1:
              raise SystemExit(
                  "Action Layer is deployed but queue is empty. "
                  "Run rigor-company-schedule once from the Netlify dashboard, "
                  "wait for completion, then rerun this proof."
              )
          print("Durable action queue exercised:", queue)
          PY

      - name: Publish proof
        shell: bash
        run: |
          {
            echo "## RIGOR Action Layer v1 — LIVE PROOF"
            echo ""
            echo "- Preview: https://rigor-flow-preview.netlify.app"
            echo "- Action policy layer: PASS"
            echo "- Durable action queue: exercised"
            echo "- External scheduled-function invocation is intentionally not used"
            echo ""
            echo '~~~json'
            cat /tmp/health.json
            echo ""
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

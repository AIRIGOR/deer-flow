name: RIGOR CI

on:
  push:
    branches:
      - feat/rigor-netlify-beta-v1
    paths:
      - "rigor_beta/**"
      - "backend/app/gateway/routers/rigor.py"
      - "backend/packages/harness/deerflow/rigor/**"
      - "backend/packages/harness/deerflow/persistence/rigor/**"
      - "backend/packages/harness/deerflow/persistence/models/__init__.py"
      - "backend/packages/harness/deerflow/persistence/migrations/versions/*rigor*.py"
      - "backend/packages/harness/deerflow/subagents/builtins/rigor_company.py"
      - "backend/packages/harness/deerflow/subagents/builtins/__init__.py"
      - "backend/tests/test_rigor_*.py"
      - "skills/public/rigor-company-operator/**"
      - ".github/workflows/rigor-beta-ci.yml"
      - ".github/workflows/rigor-company-release-gate.yml"
  pull_request:
    paths:
      - "rigor_beta/**"
      - "backend/app/gateway/routers/rigor.py"
      - "backend/packages/harness/deerflow/rigor/**"
      - "backend/packages/harness/deerflow/subagents/builtins/rigor_company.py"
      - "backend/packages/harness/deerflow/subagents/builtins/__init__.py"
      - "backend/tests/test_rigor_*.py"
      - "skills/public/rigor-company-operator/**"
      - ".github/workflows/rigor-company-release-gate.yml"
  workflow_dispatch:

jobs:
  rigor-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rigor_beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rigor_beta/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

  rigor-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --group dev

      - name: Run focused RIGOR tests
        run: >
          uv run pytest -q
          tests/test_rigor_analyzer.py
          tests/test_rigor_manager.py
          tests/test_rigor_repository.py
          tests/test_rigor_router.py
          tests/test_rigor_service.py
          tests/test_rigor_company_subagents.py
          tests/test_rigor_company_operator.py
          tests/test_rigor_company_state.py

  deploy-preview:
    needs:
      - rigor-beta
      - rigor-core
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.rigor-beta.result == 'success' &&
          needs.rigor-core.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 017e4a4d-7db9-4e61-88fd-56dd2b2be844
      RIGOR_URL: https://rigor-flow-preview.netlify.app
      DEERFLOW_URL: https://rigor-deerflow.onrender.com

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rigor_beta/package-lock.json

      - name: Install deploy dependencies
        working-directory: rigor_beta
        run: npm ci

      - name: Require Netlify authorization
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not configured."
            echo "Run: bash go"
            exit 1
          fi

      - name: Deploy isolated RIGOR preview
        working-directory: rigor_beta
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx netlify deploy             --prod             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --message "RIGOR preview ${GITHUB_SHA}"             --json | tee /tmp/netlify-deploy.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/netlify-deploy.json", encoding="utf-8"))
          deploy_id=data.get("deploy_id") or data.get("deployId")
          deploy_url=data.get("deploy_url") or data.get("deployUrl")
          site_url=data.get("url") or data.get("site_url") or data.get("siteUrl")
          if not deploy_id:
              raise SystemExit(f"Missing deploy id: {data}")
          with open("/tmp/deploy-summary.txt","w",encoding="utf-8") as fh:
              fh.write(f"deploy_id={deploy_id}\n")
              fh.write(f"deploy_url={deploy_url or ''}\n")
              fh.write(f"site_url={site_url or ''}\n")
          print(open("/tmp/deploy-summary.txt", encoding="utf-8").read())
          PY

      - name: Verify deployed RIGOR health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 30 "$RIGOR_URL/api/health" > /tmp/health.json; then
              python - <<'PY'
          import json
          data=json.load(open("/tmp/health.json", encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("service") == "rigor", data
          assert data.get("deerflow", {}).get("configured") is True, data
          print("RIGOR preview health: PASS")
          PY
              break
            fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 6
          done

      - name: Verify AI-company automation is deployed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$RIGOR_URL/api/company/health" > /tmp/company-health.json
          cat /tmp/company-health.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/company-health.json", encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("service") == "rigor-company", data
          assert data.get("company_automation") == "v1", data
          print("RIGOR AI-company automation: DEPLOYED")
          PY

      - name: Verify Render security boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/auth.json             --write-out "%{http_code}"             --max-time 30             --request POST             --header "Content-Type: application/json"             --data '{"objective":"ci-security-check"}'             "$DEERFLOW_URL/api/rigor/company/pulse")"
          cat /tmp/auth.json
          test "$code" = "401"
          echo "Render company pulse unauthenticated boundary: PASS"

      - name: Verify guided sample and PDF export
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 -c /tmp/rigor-cookies.txt             -X POST "$RIGOR_URL/api/start"             -H "Content-Type: application/json"             --data '{"display_name":"RIGOR CI","role":"Partner / Investor","sample_demo":true}'             > /tmp/sample.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/sample.json", encoding="utf-8"))
          assert data["production"].get("sample_demo") is True, data
          assert len(data.get("requirements", [])) == 18, len(data.get("requirements", []))
          assert len(data.get("conflicts", [])) > 0, len(data.get("conflicts", []))
          print("Guided sample: PASS")
          PY
          curl -fsS --max-time 60 -b /tmp/rigor-cookies.txt             "$RIGOR_URL/api/reports/advance.pdf"             -o /tmp/advance.pdf
          test "$(head -c 4 /tmp/advance.pdf)" = "%PDF"
          test "$(wc -c < /tmp/advance.pdf)" -gt 500
          echo "Advance Report PDF: PASS ($(wc -c < /tmp/advance.pdf) bytes)"

      - name: Publish proof of work
        shell: bash
        run: |
          {
            echo "## RIGOR Gated Preview Deploy — PASS"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Preview: https://rigor-flow-preview.netlify.app"
            echo "- RIGOR health: PASS"
            echo "- AI-company automation health: PASS"
            echo "- Render unauthorized company pulse = 401: PASS"
            echo "- Guided production sample: PASS"
            echo "- Advance Report PDF: PASS"
            echo ""
            echo "### Netlify deployment"
            echo '~~~'
            cat /tmp/deploy-summary.txt
            echo '~~~'
            echo ""
            echo "**Primary production site was not promoted.**"
          } >> "$GITHUB_STEP_SUMMARY"

name: RIGOR CI

on:
  push:
    branches:
      - feat/rigor-netlify-beta-v1
    paths:
      - "rigor_beta/**"
      - "backend/app/gateway/routers/rigor.py"
      - "backend/app/rigor_service.py"
      - "backend/packages/harness/deerflow/rigor/**"
      - "backend/packages/harness/deerflow/persistence/rigor/**"
      - "backend/packages/harness/deerflow/persistence/models/__init__.py"
      - "backend/packages/harness/deerflow/persistence/migrations/versions/*rigor*.py"
      - "backend/packages/harness/deerflow/subagents/builtins/rigor_company.py"
      - "backend/packages/harness/deerflow/subagents/builtins/__init__.py"
      - "backend/tests/test_rigor_*.py"
      - "skills/public/rigor-company-operator/**"
      - ".github/workflows/rigor-beta-ci.yml"
      - ".github/workflows/rigor-company-release-gate.yml"
  pull_request:
    paths:
      - "rigor_beta/**"
      - "backend/app/gateway/routers/rigor.py"
      - "backend/app/rigor_service.py"
      - "backend/packages/harness/deerflow/rigor/**"
      - "backend/packages/harness/deerflow/subagents/builtins/rigor_company.py"
      - "backend/packages/harness/deerflow/subagents/builtins/__init__.py"
      - "backend/tests/test_rigor_*.py"
      - "skills/public/rigor-company-operator/**"
      - ".github/workflows/rigor-company-release-gate.yml"
  workflow_dispatch:

jobs:
  rigor-beta:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rigor_beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rigor_beta/package-lock.json

      - name: Regenerate PDF dependency lock on repair branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/rigor-source-provenance-20261013'
        run: |
          npm install --prefix rigor_beta --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rigor_beta/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(rigor): lock PDF.js 5 dependencies"
            git push origin HEAD:fix/rigor-source-provenance-20261013
          fi
        working-directory: .
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high


  rigor-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --group dev

      - name: Run focused RIGOR tests
        run: >
          uv run pytest -q
          tests/test_rigor_analyzer.py
          tests/test_rigor_manager.py
          tests/test_rigor_repository.py
          tests/test_rigor_router.py
          tests/test_rigor_service.py
          tests/test_rigor_company_subagents.py
          tests/test_rigor_company_operator.py
          tests/test_rigor_company_action_executor.py
          tests/test_rigor_company_state.py

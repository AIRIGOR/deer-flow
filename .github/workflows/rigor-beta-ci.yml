name: RIGOR CI

on:
  push:
    branches:
      - feat/rigor-netlify-beta-v1
    paths:
      - "rigor_beta/**"
      - "backend/app/gateway/routers/rigor.py"
      - "backend/packages/harness/deerflow/rigor/**"
      - "backend/tests/test_rigor_*.py"
      - ".github/workflows/rigor-beta-ci.yml"
  pull_request:
    paths:
      - "rigor_beta/**"
      - "backend/app/gateway/routers/rigor.py"
      - "backend/packages/harness/deerflow/rigor/**"
      - "backend/tests/test_rigor_*.py"

jobs:
  rigor-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rigor_beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rigor_beta/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

  rigor-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --group dev

      - name: Run focused RIGOR tests
        run: >
          uv run pytest -q
          tests/test_rigor_analyzer.py
          tests/test_rigor_manager.py
          tests/test_rigor_repository.py
          tests/test_rigor_router.py

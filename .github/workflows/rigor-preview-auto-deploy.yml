name: RIGOR Preview Auto Deploy

on:
  workflow_run:
    workflows:
      - RIGOR CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: rigor-flow-preview-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'feat/rigor-netlify-beta-v1'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: 017e4a4d-7db9-4e61-88fd-56dd2b2be844
      RIGOR_URL: https://rigor-flow-preview.netlify.app
      DEERFLOW_URL: https://rigor-deerflow.onrender.com

    steps:
      - name: Resolve verified commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rigor_beta/package-lock.json

      - name: Install RIGOR preview dependencies
        working-directory: rigor_beta
        run: npm ci

      - name: Type check before deploy
        working-directory: rigor_beta
        run: npm run check

      - name: Unit tests before deploy
        working-directory: rigor_beta
        run: npm test

      - name: Require Netlify authorization
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy isolated RIGOR preview
        id: deploy
        working-directory: rigor_beta
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx netlify deploy             --prod             --site "$NETLIFY_SITE_ID"             --auth "$NETLIFY_AUTH_TOKEN"             --message "RIGOR preview ${{ steps.commit.outputs.sha }}"             --json | tee /tmp/netlify-deploy.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/netlify-deploy.json", encoding="utf-8"))
          deploy_id=data.get("deploy_id") or data.get("deployId")
          deploy_url=data.get("deploy_url") or data.get("deployUrl")
          site_url=data.get("url") or data.get("site_url") or data.get("siteUrl")
          if not deploy_id:
              raise SystemExit(f"Missing deploy id: {data}")
          with open("/tmp/deploy-summary.txt","w",encoding="utf-8") as fh:
              fh.write(f"deploy_id={deploy_id}\n")
              fh.write(f"deploy_url={deploy_url or ''}\n")
              fh.write(f"site_url={site_url or ''}\n")
          print(open("/tmp/deploy-summary.txt", encoding="utf-8").read())
          PY

      - name: Verify deployed RIGOR health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 30 "$RIGOR_URL/api/health" > /tmp/health.json; then
              python - <<'PY'
          import json
          data=json.load(open("/tmp/health.json", encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("service") == "rigor", data
          assert data.get("deerflow", {}).get("configured") is True, data
          print("RIGOR preview health: PASS")
          PY
              break
            fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 6
          done

      - name: Verify AI-company automation is deployed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$RIGOR_URL/api/company/health" > /tmp/company-health.json
          cat /tmp/company-health.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/company-health.json", encoding="utf-8"))
          assert data.get("status") == "ok", data
          assert data.get("service") == "rigor-company", data
          assert data.get("company_automation") == "v1", data
          print("RIGOR AI-company automation: DEPLOYED")
          PY

      - name: Verify Render AI-company security boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/auth.json             --write-out "%{http_code}"             --max-time 30             --request POST             --header "Content-Type: application/json"             --data '{"objective":"preview-auto-deploy-security-check"}'             "$DEERFLOW_URL/api/rigor/company/pulse")"
          cat /tmp/auth.json
          test "$code" = "401"
          echo "Render company pulse unauthenticated boundary: PASS"

      - name: Verify guided sample and PDF export
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 -c /tmp/rigor-cookies.txt             -X POST "$RIGOR_URL/api/start"             -H "Content-Type: application/json"             --data '{"display_name":"Auto Deploy Gate","role":"Partner / Investor","sample_demo":true}'             > /tmp/sample.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/sample.json", encoding="utf-8"))
          assert data["production"].get("sample_demo") is True, data
          assert len(data.get("requirements", [])) == 18, len(data.get("requirements", []))
          assert len(data.get("conflicts", [])) > 0, len(data.get("conflicts", []))
          print("Guided sample: PASS")
          PY
          curl -fsS --max-time 60 -b /tmp/rigor-cookies.txt             "$RIGOR_URL/api/reports/advance.pdf"             -o /tmp/advance.pdf
          test "$(head -c 4 /tmp/advance.pdf)" = "%PDF"
          test "$(wc -c < /tmp/advance.pdf)" -gt 500
          echo "Advance Report PDF: PASS ($(wc -c < /tmp/advance.pdf) bytes)"

      - name: Publish proof of work
        shell: bash
        run: |
          {
            echo "## RIGOR Preview Auto Deploy — PASS"
            echo ""
            echo "- Commit: \`${{ steps.commit.outputs.sha }}\`"
            echo "- Site: https://rigor-flow-preview.netlify.app"
            echo "- RIGOR health: PASS"
            echo "- AI-company automation health: PASS"
            echo "- Render unauthenticated company pulse = 401: PASS"
            echo "- Guided production sample: PASS"
            echo "- Advance Report PDF: PASS"
            echo ""
            echo "### Netlify deployment"
            echo '~~~'
            cat /tmp/deploy-summary.txt
            echo '~~~'
            echo ""
            echo "**Production promotion was not performed.**"
          } >> "$GITHUB_STEP_SUMMARY"
